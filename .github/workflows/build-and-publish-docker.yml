name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'images/**/Dockerfile'
      - '.github/workflows/build-and-publish-docker.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'images/**/Dockerfile'

env:
  REGISTRY: ghcr.io

jobs:
  discover-images:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get changed files
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files: images/**/Dockerfile

      - name: Discover changed images
        id: set-matrix
        run: |
          # Parse changed files to extract image names
          images=$(echo "${{ steps.changed.outputs.all_changed_files }}" | \
            grep -oP 'images/\K[^/]+(?=/Dockerfile)' | \
            sort -u | \
            jq -R . | jq -s -c '{image: .}')
          
          # If no files changed (e.g., workflow-only trigger), build all images
          if [ -z "$(echo "$images" | jq -r '.image[]? // empty')" ]; then
            images=$(ls -d images/*/ | sed 's|images/||g' | sed 's|/||g' | jq -R . | jq -s -c '{image: .}')
          fi
          
          echo "matrix=$images" >> $GITHUB_OUTPUT
          echo "Building images: $images"

  build-and-push:
    needs: discover-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJson(needs.discover-images.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./images/${{ matrix.image }}
          file: ./images/${{ matrix.image }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image URL
        if: github.event_name != 'pull_request'
        run: |
          echo "✓ Docker image published:"
          echo "  ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest"
          echo "  ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}"
          echo ""
          echo "Pull with:"
          echo "  docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest"
